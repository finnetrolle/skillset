name: Check skillset
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: make PYTHON=python check test catalog-check
      - run: bash -n skills/diagnosing-bugs/scripts/hitl-loop.template.sh
